name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  java:
    name: Java parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build
        working-directory: java
        run: ./build.sh

      - name: Verify example output is reproducible
        run: |
          for name in OrderService Nesting; do
            cat "examples/$name.java" \
              | java -jar java/JavaCodeParser_Full.jar --pretty --file "examples/$name.java" > actual.json
            diff -u "examples/$name.java.output.json" actual.json
          done

  csharp:
    name: C# parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build
        working-directory: csharp
        run: ./build.sh

      - name: Verify example output is reproducible
        run: |
          for name in OrderService Nesting; do
            cat "examples/$name.cs" \
              | ./csharp/linux-x64/CSharpCodeParser --pretty --file "examples/$name.cs" > actual.json
            diff -u "examples/$name.cs.output.json" actual.json
          done
